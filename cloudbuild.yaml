# Google Cloud Build configuration for AI Calling Center
# This file automates the deployment process to Google Cloud Platform

steps:
  # Step 1: Install dependencies
  - name: 'node:18'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm install --frozen-lockfile

  # Step 2: Build the project
  - name: 'node:18'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack enable
        corepack prepare pnpm@latest --activate
        # Build types first
        pnpm --filter @eva/types build
        # Build frontend (skip on errors for now due to missing anon key)
        pnpm --filter @eva/frontend build || echo "Frontend build skipped - configure SUPABASE_ANON_KEY"

  # Step 3: Build Docker image for core-api
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-calling-center-api:$BUILD_ID'
      - '-f'
      - 'services/core-api/Dockerfile'
      - '.'

  # Step 4: Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-calling-center-api:$BUILD_ID'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-calling-center-api'
      - '--image=gcr.io/$PROJECT_ID/ai-calling-center-api:$BUILD_ID'
      - '--platform=managed'
      - '--region=us-central1'
      - '--port=3001'
      - '--allow-unauthenticated'
      - '--set-env-vars=PORT=3001'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-instances=10'

# Configuration options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build process
timeout: '1200s'

# Substitutions for environment-specific deployments
substitutions:
  _ENVIRONMENT: 'production'
  _REGION: 'us-central1'