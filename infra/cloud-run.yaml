# PRD v1.3, Sec 5: Cloud Run Deployment Manifest
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-calling-center-api
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # PRD Sec 1: Scale to 10,000 concurrent calls (requires high concurrency)
        run.googleapis.com/container-concurrency: 250 # Max concurrent requests per container
    spec:
      containerConcurrency: 250
      timeoutSeconds: 300
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/ai-calling-center-api:latest # <-- REPLACE with your image path
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              # PRD Sec 5: 512MiB memory limit
              memory: 512Mi
              cpu: '1' # 1 vCPU
          env:
            - name: PORT
              value: "8080"
            # --- Inject secrets from GCP Secret Manager ---
            - name: VAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: VAPI_KEY
                  key: 'latest'
            - name: STRIPE_SECRET
              valueFrom:
                secretKeyRef:
                  name: STRIPE_SECRET
                  key: 'latest'
            - name: GEMINI_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_KEY
                  key: 'latest'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL
                  key: 'latest'
            - name: POSTGRES_READ_REPLICA_URL
              valueFrom:
                secretKeyRef:
                  name: POSTGRES_READ_REPLICA_URL
                  key: 'latest'
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: SUPABASE_SERVICE_ROLE_KEY
                  key: 'latest'
  traffic:
    - percent: 100
      latestRevision: true
